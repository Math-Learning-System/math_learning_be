services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mathmaster
      POSTGRES_USER: mathmaster
      POSTGRES_PASSWORD: mathmaster
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass 12345
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mathmaster
      SPRING_DATASOURCE_USERNAME: mathmaster
      SPRING_DATASOURCE_PASSWORD: mathmaster
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: 12345
      BACKEND_URL: http://localhost:8081
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
